<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bestbuy — Business Card Back</title>
  <link rel="stylesheet" href="css/card.css" />
  <style>
    @font-face {
      font-family: "Card Serif";
      src: url("fonts/NotoSerif-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    @font-face {
      font-family: "Card Serif";
      src: url("fonts/NotoSerif-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Card Sans";
      src: url("fonts/NotoSans-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Card Sans";
      src: url("fonts/NotoSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
  </style>
</head>
<body class="export">
  <article class="card card--back" aria-label="Bestbuy business card back">
    <div class="safe">
      <div class="back-layout">
        <div class="back-top">
          <div class="back-brand">
            <img
              class="bb-icon"
              src="assets/bestbuy-bb-icon.png"
              alt=""
              width="110"
              height="59"
            />
            <p class="back-brand-name">Bestbuy</p>
            <svg class="gold-wave-back" viewBox="0 0 120 12" fill="none" aria-hidden="true">
              <path
                d="M1 7C15 2.5 24 2.5 38 7C52 11.5 61 11.5 75 7C89 2.5 98 2.5 119 7"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="back-actions">
            <p class="back-kicker">Call or WhatsApp</p>
            <p class="back-phone">0724 780 932</p>
            <p class="back-phone-note">Save the number · message anytime</p>
          </div>
        </div>
        <div class="back-mid">
          <div class="back-section">
            <h2>Find us</h2>
            <p>Kenyatta Market<br />Stall 221, Nairobi</p>
          </div>
          <div class="back-section">
            <h2>Tip</h2>
            <p class="back-note">Ask at Hair by Doris — same stall.</p>
          </div>
        </div>
      </div>
    </div>
  </article>
</body>
</html>
